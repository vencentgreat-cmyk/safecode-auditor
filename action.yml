name: SafeCode Auditor
description: Scan Firebase Security Rules and application secrets in pull requests
author: Yuxin Yang
branding:
  icon: shield
  color: red
inputs:
  path:
    description: File or directory to scan
    required: false
    default: .
  fail-on:
    description: Minimum severity that fails the check
    required: false
    default: high
  baseline:
    description: Optional baseline file committed to the repository
    required: false
    default: ""
  ignore-rules:
    description: Optional comma-separated rule IDs to ignore
    required: false
    default: ""
  upload-sarif:
    description: Upload results to GitHub Code Scanning
    required: false
    default: "true"
outputs:
  sarif-file:
    description: Path to the generated SARIF report
    value: ${{ steps.paths.outputs.sarif }}
  scan-exit-code:
    description: Raw exit code from safecode (0=clean, 1=config/exec error, 2=findings met threshold)
    value: ${{ steps.scan.outputs.scan-exit-code }}
runs:
  using: composite
  steps:
    - name: Set report path
      id: paths
      shell: bash
      run: echo "sarif=${RUNNER_TEMP}/saferules-results.sarif" >> "$GITHUB_OUTPUT"

    - name: Install SafeCode Auditor
      shell: bash
      run: python -m pip install "${GITHUB_ACTION_PATH}"

    - name: Scan repository
      id: scan
      shell: bash
      env:
        SAFERULES_TARGET: ${{ inputs.path }}
        SAFERULES_FAIL_ON: ${{ inputs['fail-on'] }}
        SAFERULES_BASELINE: ${{ inputs.baseline }}
        SAFERULES_IGNORE: ${{ inputs['ignore-rules'] }}
        SAFERULES_SARIF: ${{ steps.paths.outputs.sarif }}
      run: |
        set +e
        args=(
          "$SAFERULES_TARGET"
          --format sarif
          --output "$SAFERULES_SARIF"
          --fail-on "$SAFERULES_FAIL_ON"
        )
        if [[ -n "$SAFERULES_BASELINE" ]]; then
          args+=(--baseline "$SAFERULES_BASELINE")
        fi
        IFS=',' read -ra ignored <<< "$SAFERULES_IGNORE"
        for rule_id in "${ignored[@]}"; do
          rule_id="${rule_id//[[:space:]]/}"
          if [[ -n "$rule_id" ]]; then
            args+=(--ignore-rule "$rule_id")
          fi
        done
        safecode "${args[@]}"
        code=$?
        echo "scan-exit-code=$code" >> "$GITHUB_OUTPUT"
        case $code in
          0)
            echo "::notice::SafeCode Auditor: no findings at or above '${SAFERULES_FAIL_ON}'."
            exit 0
            ;;
          2)
            echo "::warning::SafeCode Auditor: findings met '${SAFERULES_FAIL_ON}' threshold."
            exit 0
            ;;
          1)
            echo "::error::SafeCode Auditor: configuration or execution error (invalid path, baseline, or output)."
            exit 1
            ;;
          *)
            echo "::error::SafeCode Auditor: unexpected exit code ${code}."
            exit 1
            ;;
        esac

    - name: Upload SARIF
      if: ${{ always() && inputs['upload-sarif'] == 'true' && steps.scan.outputs.scan-exit-code != '1' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.paths.outputs.sarif }}
        category: saferules

    - name: Enforce severity threshold
      if: ${{ steps.scan.outputs.scan-exit-code == '2' }}
      shell: bash
      run: |
        echo "SafeCode Auditor found a finding at or above '${{ inputs['fail-on'] }}'."
        exit 1