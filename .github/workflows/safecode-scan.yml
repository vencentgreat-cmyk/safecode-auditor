name: SafeCode Auditor CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test tools
        run: python -m pip install . pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q safecode_auditor scanner main.py

      - name: Generate and validate JSON
        run: |
          safecode test_targets --format json --output /tmp/saferules.json
          python -m json.tool /tmp/saferules.json > /dev/null

      - name: Generate and validate SARIF
        run: |
          safecode test_targets --format sarif --output /tmp/saferules.sarif
          python -m json.tool /tmp/saferules.sarif > /dev/null
