name: SafeCode Auditor CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test tools
        run: python -m pip install . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q safecode_auditor scanner main.py
      - name: Generate and validate JSON
        run: |
          safecode test_targets --format json --output /tmp/saferules.json
          python -m json.tool /tmp/saferules.json > /dev/null
      - name: Generate and validate SARIF
        run: |
          safecode test_targets --format sarif --output /tmp/saferules.sarif
          python -m json.tool /tmp/saferules.sarif > /dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .