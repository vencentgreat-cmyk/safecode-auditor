[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safecode-auditor"
dynamic = ["version"]
description = "A PR-ready security scanner for Firebase rules and application secrets"
requires-python = ">=3.11"
dependencies = []
license = { file = "LICENSE" }
readme = "README.md"
authors = [
  { name = "Yuxin Yang" }
]
keywords = ["firebase", "security", "sarif", "static-analysis", "firestore", "realtime-database"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/vencentgreat-cmyk/safecode-auditor"
Repository = "https://github.com/vencentgreat-cmyk/safecode-auditor"
Issues = "https://github.com/vencentgreat-cmyk/safecode-auditor/issues"

[project.scripts]
safecode = "safecode_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["scanner*", "safecode_auditor*"]

[tool.setuptools.dynamic]
version = { attr = "safecode_auditor.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["test_targets", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"